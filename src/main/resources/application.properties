spring.application.name=quantitymeasurementapp

# ==============================
# Repository Configuration
# Use "database" for JDBC persistence, "cache" for in-memory
# ==============================
repository.type=database

# ==============================
# H2 Database Configuration (Development / Testing)
# ==============================
db.url=jdbc:h2:mem:quantitymeasurementdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
db.username=sa
db.password=
db.driver=org.h2.Driver

# ==============================
# Connection Pool Settings
# ==============================
db.pool.size=10
db.pool.timeout=30000
db.pool.idle.timeout=600000

# ==============================
# Schema Initialization
# ==============================
db.schema.file=db/schema.sql

# ==============================
# MySQL Configuration (commented out - for production use)
# ==============================
# db.url=jdbc:mysql://localhost:3306/quantitymeasurementdb?useSSL=false&allowPublicKeyRetrieval=true
# db.username=root
# db.password=yourpassword
# db.driver=com.mysql.cj.jdbc.Driver

# ==============================
# PostgreSQL Configuration (commented out)
# ==============================
# db.url=jdbc:postgresql://localhost:5432/quantitymeasurementdb
# db.username=postgres
# db.password=yourpassword
# db.driver=org.postgresql.Driver

# ==============================
# Logging Configuration
# ==============================
logging.level=INFO
logging.level.com.quantity=DEBUG